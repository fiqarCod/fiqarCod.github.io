const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LANGS=['id','en','ja','zh-CN','zh-TW'],LNAME=['Indonesia','English','日本語','简体中文','繁體中文'];
let LG;try{LG=localStorage.getItem('lang')}catch(e){}
if(!LANGS.includes(LG)){const n=(navigator.language||'en').toLowerCase();LG=n.startsWith('id')?'id':n.startsWith('ja')?'ja':/^zh-(tw|hk|mo|hant)/.test(n)?'zh-TW':n.startsWith('zh')?'zh-CN':'en'}
const CJK=()=>LG==='ja'||LG.startsWith('zh');
const L=(o,k)=>(LG!=='id'&&((o[LG]&&o[LG][k])||(o.en&&o.en[k])))||o[k];
const fmt=s=>{if(CJK()){const p=s.split('-');return p[0]+'年'+(p[1]?(+p[1])+'月':'')+(p[2]?(+p[2])+'日':'')}const m=T[LG].mon;return s.length==4?s:s.length==7?m[+s.slice(5)-1]+' '+s.slice(0,4):(+s.slice(8))+' '+m[+s.slice(5,7)-1]+' '+s.slice(0,4)};
const when=i=>i.start?fmt(i.start)+(i.end&&i.end!==i.start?' – '+fmt(i.end):(!i.end&&i.now?' – '+T[LG].now:'')):(L(i,'status')||'');
const item=(i,lab)=>`<article class="item"><div class="when">${lab?esc(T[LG].cat[i.cat]||i.cat)+'<br>':''}${esc(when(i))}</div><div><h3>${esc(L(i,'title'))}</h3>${L(i,'org')?`<div class="org">${esc(L(i,'org'))}</div>`:''}
${i.type==='plan'?`<span class="badge">${T[LG].plan}</span>`:''}${i.ver==='review'?`<span class="badge w">${T[LG].upd}</span>`:''}
${L(i,'desc')?`<p>${esc(L(i,'desc'))}</p>`:''}${L(i,'list')?`<ul>${L(i,'list').map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
<div class="chips">${(i.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div></article>`;
const byStart=(a,b)=>(b.start||'').localeCompare(a.start||'');
const fill=(id,cats)=>{const r=PUB.filter(i=>cats.includes(i.cat)).sort(byStart);const sec=$('#'+id);sec.hidden=!r.length;const a=$(`nav a[href="#${id}"]`);if(a)a.hidden=!r.length;sec.querySelector('.list').innerHTML=r.map(i=>item(i)).join('')};
let gc='';
function render(){
  const t=T[LG];document.documentElement.lang=LG;
  $$('[data-i]').forEach(e=>{const k=e.dataset.i;e.textContent=/^n\d$/.test(k)?t.n[+k[1]]:t[k]});
  $('#q').placeholder=t.ph;$('#lang').value=LG;
  $('#chips').innerHTML=t.chips.map(c=>`<span>${esc(c)}</span>`).join('');
  fill('pendidikan',['education']);fill('pengalaman',['work','org']);fill('proyek',['project']);fill('belajar',['learning']);fill('tujuan',['goal']);
  const k=LANGS.indexOf(LG),sg=s=>Array.isArray(s)?s[k]:s;
  $('#skills').innerHTML=SK.map(([g,l])=>`<div class="skillgrp"><div class="when">${g[k]}</div><div class="chips">${l.map(s=>`<span>${esc(sg(s))}</span>`).join('')}</div></div>`).join('');
  const nSk=SK.slice(0,6).reduce((n,[,l])=>n+l.length,0),cert=G.filter(g=>g.cat==='sertifikat').length;
  $('#stats').innerHTML=[[t.st[0],PUB.filter(i=>i.cat==='work').length],[t.st[1],nSk],...(cert?[[t.st[2],cert]]:[]),[t.st[3],PUB.length]].map(([l,n])=>`<div><b>${n}</b><span>${l}</span></div>`).join('');
  const P=S.profile||{};$('#brand').textContent=P.name||'';document.title=(P.name||'')+' | IT Support, Networking, Information Systems';
  if(P.email){$('#mail').href='mailto:'+P.email;$('#mail').textContent=P.email}
  $('#soc').innerHTML=[['GitHub',P.github],['LinkedIn',P.linkedin]].filter(x=>x[1]).map(([n,u])=>`<a href="${esc(u)}" rel="noopener" target="_blank">${n}</a>`).join('');
  $('#foot').textContent='© '+new Date().getFullYear()+' '+(P.name||'')+'. '+t.foot;
  const c0=$('#fc').value,y0=$('#fy').value;
  $('#fc').innerHTML=`<option value="">${t.allc}</option>`+Object.entries(t.cat).map(([a,b])=>`<option value="${a}">${b}</option>`).join('');
  const ys=[...new Set(PUB.filter(i=>i.start).map(i=>i.start.slice(0,4)))].sort().reverse();
  $('#fy').innerHTML=`<option value="">${t.ally}</option>`+ys.map(y=>`<option>${y}</option>`).join('')+`<option value="none">${t.nodate}</option>`;
  $('#fc').value=c0;$('#fy').value=y0;tl();gal();
}
function tl(){
  const q=$('#q').value.trim().toLowerCase(),c=$('#fc').value,y=$('#fy').value;
  const r=PUB.filter(i=>(!c||i.cat===c)&&(!y||(y==='none'?!i.start:i.start&&i.start.slice(0,4)===y))&&(!q||JSON.stringify(i).toLowerCase().includes(q))).sort(byStart);
  if(!r.length){$('#tl').innerHTML=`<p class="empty">${T[LG].none}</p>`;return}
  let h='',last='';r.forEach(i=>{const g=i.start?i.start.slice(0,4):T[LG].nodate;if(g!==last){h+=`<div class="yr">${g}</div>`;last=g}h+=item(i,1)});$('#tl').innerHTML=h;
}
function gal(){
  const sec=$('#galeri'),cats=[...new Set(G.map(g=>g.cat))];sec.hidden=!cats.length;$('nav a[href="#galeri"]').hidden=!cats.length;if(!cats.length)return;
  if(!cats.includes(gc))gc=cats[0];
  $('.gtabs').innerHTML=cats.map(k=>`<button aria-pressed="${k===gc}" data-k="${k}">${esc(T[LG].gcat[k]||k)}</button>`).join('');
  $('#gg').innerHTML=G.filter(g=>g.cat===gc).map((g,i)=>`<button class="tile ${gc==='sertifikat'?'doc':''}" data-n="${i}"><img src="${esc(g.src)}" alt="${esc(L(g,'title'))}" loading="lazy"><div class="cap"><b>${esc(L(g,'title'))}</b><small>${esc(L(g,'cap')||'')}</small></div></button>`).join('');
}
$('.gtabs').onclick=e=>{const b=e.target.closest('button');if(b){gc=b.dataset.k;gal()}};
$('#gg').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;const g=G.filter(x=>x.cat===gc)[+t.dataset.n],im=$('#lb img');im.src=g.src;im.alt=L(g,'title');$('#lb b').textContent=L(g,'title');$('#lb small').textContent=L(g,'cap')||'';$('#lb').showModal()};
$('#lbx').onclick=()=>$('#lb').close();$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')e.target.close()});
['input','change'].forEach(e=>['#q','#fc','#fy'].forEach(s=>$(s).addEventListener(e,tl)));
$('#lang').innerHTML=LANGS.map((c,i)=>`<option value="${c}">${LNAME[i]}</option>`).join('');
$('#lang').onchange=e=>{LG=e.target.value;try{localStorage.setItem('lang',LG)}catch(x){}render()};

const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
const X={json:()=>dl('profile-public.json',JSON.stringify(PUB,null,2),'application/json'),
md:()=>dl('profile-public.md','# '+(S.profile.name||'')+'\n\n'+[...PUB].sort(byStart).map(i=>`## ${L(i,'title')}\n*${T[LG].cat[i.cat]}${L(i,'org')?' | '+L(i,'org'):''} | ${when(i)}*\n\n${L(i,'desc')||''}\n${(L(i,'list')||[]).map(x=>'- '+x).join('\n')}\n\nTags: ${(i.tags||[]).join(', ')}\n`).join('\n'),'text/markdown'),
csv:()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl('profile-public.csv','\ufeffid,category,title,organization,start,end,status,type,verification,tags\n'+PUB.map(i=>[i.id,i.cat,L(i,'title'),L(i,'org'),i.start,i.end,L(i,'status'),i.type,i.ver,(i.tags||[]).join('; ')].map(q).join(',')).join('\n'),'text/csv')}};
$$('[data-x]').forEach(b=>b.onclick=X[b.dataset.x]);

const root=document.documentElement;
try{root.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){root.dataset.theme='light'}
$('#theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}col()};

const cv=$('#wave'),ctx=cv.getContext('2d'),hero=$('.hero'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,mx=-999,my=-999,tt=0,color='#2563eb';const col=()=>{color=getComputedStyle(root).getPropertyValue('--accent').trim()};
function rs(){const d=Math.min(devicePixelRatio||1,2);W=hero.clientWidth;H=hero.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});hero.addEventListener('pointerleave',()=>{mx=my=-999});
function draw(){tt+=.012;ctx.clearRect(0,0,W,H);ctx.strokeStyle=color;ctx.lineWidth=1;const n=W<600?14:22;
 for(let i=0;i<n;i++){const b=H*.08+i/(n-1)*H*.84;ctx.globalAlpha=.1+.16*Math.sin(i/(n-1)*Math.PI);ctx.beginPath();
  for(let x=0;x<=W;x+=10){let y=b+Math.sin(x*.006+tt*1.2+i*.35)*14+Math.sin(x*.017-tt*1.8+i*.6)*6;const dx=x-mx,dy=b-my;y+=Math.exp(-(dx*dx+dy*dy)/24000)*50*(dy>=0?1:-1);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
 if(!still)requestAnimationFrame(draw)}
render();col();rs();draw();
